[package]
name = "nullyt"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp", "png"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
ureq = "3.5.2"
window-vibrancy = "0.8.1"

[build-dependencies]
slint-build = "1.18.1"
ureq = "3.5.2"
